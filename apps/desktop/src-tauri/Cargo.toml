[package]
name = "mdeditor"
version = "0.1.0"
description = "A local-first Markdown editor"
authors = ["MDEditor contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "mdeditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
test-data-override = []
webdriver = ["dep:tauri-plugin-wdio-webdriver", "test-data-override"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
notify = "8.2"
regex = "1"
trash = "5.2.8"
urlencoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
